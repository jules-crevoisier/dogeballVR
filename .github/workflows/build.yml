name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler le projet C#
        run: dotnet build DogeballVR.csproj --nologo

      - name: Lancer la partie en simulation (Godot headless, 150 s de jeu)
        env:
          GODOT_VERSION: 4.3-stable
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q godot.zip
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --build-solutions --quit
          # 9000 images à 60 i/s = 150 s de jeu : une manche entière, la prolongation et le début de la suivante.
          # Toute erreur de script C# fait échouer le job.
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 9000 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" run.log; then
            echo "Erreur à l'exécution"; exit 1
          fi
          echo "Portée des lancers des bots (touches/lancers par distance, cumulé sur la partie) :"
          grep "\[Portée\]" run.log | tail -1

      - name: Test réseau (hôte + client automatique, 45 s en temps réel)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          # Pas de --fixed-fps ici : les délais réseau sont en temps réel.
          "$GODOT" --headless --path . --max-fps 60 --quit-after 3300 -- --host > host.log 2>&1 &
          HOST_PID=$!
          sleep 3
          "$GODOT" --headless --path . --max-fps 60 --quit-after 2400 -- --join=127.0.0.1 --net-selftest > client.log 2>&1
          wait $HOST_PID || true
          grep -E "\[Net|\[NetTest" host.log client.log | tail -20
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" host.log client.log; then
            echo "Erreur à l'exécution"; exit 1
          fi
          CATCHES=$(grep -c "attrapée par la zone 2" host.log || true)
          THROWS=$(grep -c "lancée par la zone 2" host.log || true)
          echo "Prises validées par l'hôte : $CATCHES, lancers : $THROWS"
          if [ "$CATCHES" -lt 5 ] || [ "$THROWS" -lt 5 ]; then
            echo "Le réseau ne fonctionne pas (trop peu de prises / lancers)"; exit 1
          fi
          grep -E "balles=[1-9]" client.log > /dev/null || { echo "Le client ne voit pas les balles"; exit 1; }

      - name: Test réseau sur La Fosse (lift, plateaux)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 3000 -- --map=la_fosse 2>&1 | tee fosse-solo.log
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" fosse-solo.log; then
            echo "Erreur à l'exécution (La Fosse, solo)"; exit 1
          fi
          "$GODOT" --headless --path . --max-fps 60 --quit-after 3300 -- --host --map=la_fosse > fosse-host.log 2>&1 &
          HOST_PID=$!
          sleep 3
          "$GODOT" --headless --path . --max-fps 60 --quit-after 2400 -- --join=127.0.0.1 --map=la_fosse --net-selftest > fosse-client.log 2>&1
          wait $HOST_PID || true
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" fosse-host.log fosse-client.log; then
            echo "Erreur à l'exécution (La Fosse, réseau)"; exit 1
          fi
          CATCHES=$(grep -c "attrapée par la zone 2" fosse-host.log || true)
          THROWS=$(grep -c "lancée par la zone 2" fosse-host.log || true)
          echo "La Fosse : prises $CATCHES, lancers $THROWS"
          if [ "$CATCHES" -lt 3 ] || [ "$THROWS" -lt 3 ]; then
            echo "Le réseau ne fonctionne pas sur La Fosse"; exit 1
          fi

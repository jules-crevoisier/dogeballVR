name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler le projet C#
        run: dotnet build DogeballVR.csproj --nologo

      - name: Lancer la partie en simulation (Godot headless, 150 s de jeu)
        env:
          GODOT_VERSION: 4.3-stable
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q godot.zip
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --build-solutions --quit
          # Importe les modèles glb (assets/models) avant les parties : sans cela ils ne sont pas chargés et le jeu retombe sur les formes du code.
          "$GODOT" --headless --path . --import --quit || true
          # 9000 images à 60 i/s = 150 s de jeu : une manche entière, la prolongation et le début de la suivante.
          # Toute erreur de script C# fait échouer le job.
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 9000 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" run.log; then
            echo "Erreur à l'exécution"; exit 1
          fi
          echo "Portée des lancers des bots (touches/lancers par distance, cumulé sur la partie) :"
          grep "\[Portée\]" run.log | tail -1

      - name: Test réseau (hôte + client automatique, 90 s en temps réel)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          # Pas de --fixed-fps ici : les délais réseau sont en temps réel.
          "$GODOT" --headless --path . --max-fps 60 --quit-after 6300 -- --host > host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 60); do grep -q "Hôte en écoute" host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
          "$GODOT" --headless --path . --max-fps 60 --quit-after 5400 -- --join=127.0.0.1 --net-selftest > client.log 2>&1
          wait $HOST_PID || true
          grep -E "\[Net|\[NetTest" host.log client.log | tail -20
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" host.log client.log; then
            echo "Erreur à l'exécution"; exit 1
          fi
          CATCHES=$(grep -c "attrapée par la zone 2" host.log || true)
          THROWS=$(grep -c "lancée par la zone 2" host.log || true)
          echo "Prises validées par l'hôte : $CATCHES, lancers : $THROWS"
          # Le client se fait des chandelles un lancer sur deux : 22 à 35 prises mesurées, le seuil a de la marge.
          if [ "$CATCHES" -lt 10 ] || [ "$THROWS" -lt 10 ]; then
            echo "Le réseau ne fonctionne pas (trop peu de prises / lancers)"; exit 1
          fi
          grep -E "balles=[1-9]" client.log > /dev/null || { echo "Le client ne voit pas les balles"; exit 1; }
          grep -E "touches=[1-9]" client.log > /dev/null || { echo "Les touches validées par l'hôte n'arrivent pas au client (HUD, fil des KO)"; exit 1; }

      - name: Test transport P2P (peer Steam sur UDP local, 10 % de perte)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          # Même scénario que le premier test réseau, mais SteamMultiplayerPeer sur UdpPipe (pas de client Steam en CI).
          "$GODOT" --headless --path . --max-fps 60 --quit-after 6300 -- --host --transport=udp-p2p --p2p-loss=0.1 > p2p-host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 60); do grep -q "Hôte en écoute" p2p-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
          "$GODOT" --headless --path . --max-fps 60 --quit-after 5400 -- --join=127.0.0.1 --net-selftest --transport=udp-p2p --p2p-loss=0.1 > p2p-client.log 2>&1
          wait $HOST_PID || true
          grep -E "\[Net|\[NetTest|\[P2P" p2p-host.log p2p-client.log | tail -20
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" p2p-host.log p2p-client.log; then
            echo "Erreur à l'exécution (transport P2P)"; exit 1
          fi
          grep -q "\[P2P\] Pair [0-9]* connecté" p2p-host.log || { echo "Le client P2P ne s'est pas présenté à l'hôte"; exit 1; }
          CATCHES=$(grep -c "attrapée par la zone 2" p2p-host.log || true)
          THROWS=$(grep -c "lancée par la zone 2" p2p-host.log || true)
          echo "P2P, prises validées par l'hôte : $CATCHES, lancers : $THROWS"
          if [ "$CATCHES" -lt 5 ] || [ "$THROWS" -lt 5 ]; then
            echo "Le transport P2P ne fonctionne pas (trop peu de prises / lancers)"; exit 1
          fi
          grep -E "balles=[1-9]" p2p-client.log > /dev/null || { echo "Le client P2P ne voit pas les balles"; exit 1; }

      - name: Test réseau sur La Fosse (lift, plateaux)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 3000 -- --map=la_fosse 2>&1 | tee fosse-solo.log
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" fosse-solo.log; then
            echo "Erreur à l'exécution (La Fosse, solo)"; exit 1
          fi
          "$GODOT" --headless --path . --max-fps 60 --quit-after 4800 -- --host --map=la_fosse > fosse-host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 60); do grep -q "Hôte en écoute" fosse-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
          "$GODOT" --headless --path . --max-fps 60 --quit-after 4200 -- --join=127.0.0.1 --map=la_fosse --net-selftest > fosse-client.log 2>&1
          wait $HOST_PID || true
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" fosse-host.log fosse-client.log; then
            echo "Erreur à l'exécution (La Fosse, réseau)"; exit 1
          fi
          CATCHES=$(grep -c "attrapée par la zone 2" fosse-host.log || true)
          THROWS=$(grep -c "lancée par la zone 2" fosse-host.log || true)
          grep "\[NetTest\] lift" fosse-client.log || true
          if grep "\[NetTest\] lift" fosse-client.log | grep -q "KO"; then echo "Le lift n'est pas validé correctement par l'hôte"; exit 1; fi
          for k in "lift triche hors pad" "lift accordé sur le pad" "lift repris par l'hôte"; do
            grep -q "$k" fosse-client.log || { echo "Test du lift incomplet : $k"; exit 1; }
          done
          echo "La Fosse : prises $CATCHES, lancers $THROWS"
          if [ "$CATCHES" -lt 2 ] || [ "$THROWS" -lt 2 ]; then
            echo "Le réseau ne fonctionne pas sur La Fosse"; exit 1
          fi

      - name: Test clavier-souris (joueur PC automatique, solo puis réseau)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 6000 -- --pc-autoplay 2>&1 | tee pc-solo.log
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" pc-solo.log; then
            echo "Erreur à l'exécution (joueur PC, solo)"; exit 1
          fi
          "$GODOT" --headless --path . --max-fps 60 --quit-after 4500 -- --host --pc-autoplay > pc-host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 60); do grep -q "Hôte en écoute" pc-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
          "$GODOT" --headless --path . --max-fps 60 --quit-after 3600 -- --join=127.0.0.1 --pc-autoplay > pc-client.log 2>&1
          wait $HOST_PID || true
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" pc-host.log pc-client.log; then
            echo "Erreur à l'exécution (joueur PC, réseau)"; exit 1
          fi
          CATCHES=$(grep -c "attrapée par la zone 2" pc-host.log || true)
          THROWS=$(grep -c "Balle [0-9]* lancée par la zone 2" pc-host.log || true)
          echo "Joueur PC client : prises validées $CATCHES, lancers $THROWS"
          if [ "$CATCHES" -lt 5 ] || [ "$THROWS" -lt 5 ]; then
            echo "Le joueur clavier-souris client n'est pas accepté par l'hôte"; exit 1
          fi

      - name: Test jeu libre Croix Néon (joueur PC 3e personne, solo puis réseau)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 6000 -- --map=croix_neon --pc-autoplay 2>&1 | tee ring-solo.log
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" ring-solo.log; then
            echo "Erreur à l'exécution (Croix Néon, solo)"; exit 1
          fi
          for ATTEMPT in 1 2 3; do
            "$GODOT" --headless --path . --max-fps 60 --quit-after 4500 -- --host --map=croix_neon --pc-autoplay > ring-host.log 2>&1 &
            HOST_PID=$!
            for i in $(seq 1 60); do grep -q "Hôte en écoute" ring-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
            "$GODOT" --headless --path . --max-fps 60 --quit-after 3600 -- --join=127.0.0.1 --map=croix_neon --pc-autoplay > ring-client.log 2>&1
            wait $HOST_PID || true
            if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" ring-host.log ring-client.log; then
              echo "Erreur à l'exécution (Croix Néon, réseau)"; exit 1
            fi
            FAIL=0
            CATCHES=$(grep -c "attrapée par la zone 2" ring-host.log || true)
            THROWS=$(grep -c "Balle [0-9]* lancée par la zone 2" ring-host.log || true)
            DASHES=$(grep -c "Dash validé pour la zone 2" ring-host.log || true)
            echo "Croix Néon, client PC libre : prises $CATCHES, lancers $THROWS, dashs $DASHES"
            if [ "$DASHES" -lt 3 ]; then
              echo "Le dash du client n'est pas reconnu par l'hôte"; FAIL=1
            fi
            PASSES=$(grep -c "(passe)" ring-host.log || true)
            LOBS=$(grep -c "(cloche)" ring-host.log || true)
            CURVES=$(grep -c "(effet)" ring-host.log || true)
            echo "Coups spéciaux du client PC validés par l'hôte : passes $PASSES, cloches $LOBS, effets $CURVES"
            if [ "$PASSES" -lt 1 ] || [ "$LOBS" -lt 1 ] || [ "$CURVES" -lt 1 ]; then
              echo "Passe, cloche ou effet du client non reconnus par l'hôte"; FAIL=1
            fi
            if [ "$CATCHES" -lt 4 ] || [ "$THROWS" -lt 4 ]; then
              echo "Le joueur libre client n'est pas accepté par l'hôte"; FAIL=1
            fi
            ROTOR=$(cat ring-host.log ring-client.log | grep -c "Poussé par le rotor" || true)
            echo "Rotor : joueurs repoussés $ROTOR"
            if [ "$ROTOR" -lt 1 ]; then echo "Le rotor n'a repoussé personne"; FAIL=1; fi
            if [ "$FAIL" = 0 ]; then break; fi
            echo "Tentative $ATTEMPT non concluante (scénario automatique non déterministe)"
            [ "$ATTEMPT" = 3 ] && exit 1
          done

      - name: Test des aides VR (attrape à 80 ms, main fermée, temps de vol, alerte, attrape parfaite)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . -- --assist-test 2>&1 | tee assist.log
          grep -q "TOUT OK" assist.log || { echo "Les aides VR ne respectent pas les critères"; exit 1; }

      - name: Test rotor du moyeu (balles tendues arrêtées par un bras, témoin sans rotor)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 2400 -- --map=croix_neon --rotor-test 2>&1 | tee rotor.log
          "$GODOT" --headless --path . --fixed-fps 60 --quit-after 2400 -- --map=croix_neon --rotor-test --rotor-off 2>&1 | tee rotor-off.log
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" rotor.log rotor-off.log; then echo "Erreur à l'exécution (rotor)"; exit 1; fi
          STOPPED=$(grep -o "test balles : [0-9]*" rotor.log | grep -o "[0-9]*$" || echo 0)
          grep -q "test balles" rotor.log && grep -q "test balles" rotor-off.log || { echo "Le test du rotor ou son témoin n'a pas rendu de résultat"; exit 1; }
          CONTROL=$(grep -o "test balles : [0-9]*" rotor-off.log | grep -o "[0-9]*$" || echo 99)
          echo "Rotor : balles arrêtées $STOPPED, témoin sans rotor $CONTROL"
          if [ "${STOPPED:-0}" -lt 10 ] || [ "${CONTROL:-99}" -gt 8 ]; then echo "Le rotor n'arrête pas les balles (ou le témoin en arrête déjà trop)"; exit 1; fi

      - name: Test balles spéciales (annonce, lancer du moyeu, souffle de la bombe)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          for ATTEMPT in 1 2 3; do
            "$GODOT" --headless --path . --max-fps 60 --quit-after 3900 -- --map=croix_neon --pc-autoplay --special-test > special.log 2>&1 || true
            if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" special.log; then echo "Erreur à l'exécution (balles spéciales)"; exit 1; fi
            ANNOUNCED=$(grep -c "Balle spéciale annoncée" special.log || true)
            LAUNCHED=$(grep -c "Balle spéciale lancée" special.log || true)
            BLASTS=$(grep -c "Bombe : explosion .* [1-9][0-9]* adversaire(s) touché(s)" special.log || true)
            echo "Essai $ATTEMPT : annonce $ANNOUNCED, lancer $LAUNCHED, souffles qui touchent $BLASTS"
            if [ "$ANNOUNCED" -ge 1 ] && [ "$LAUNCHED" -ge 1 ] && [ "$BLASTS" -ge 1 ]; then exit 0; fi
          done
          echo "Balles spéciales : annonce, lancer ou souffle manquant"; exit 1

      - name: Test échanges de plaques (hôte et client échangent leurs places, l'hôte suit)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          for ATTEMPT in 1 2 3; do
            "$GODOT" --headless --path . --max-fps 60 --quit-after 2600 -- --host --port=7360 --map=croix_neon --pc-autoplay --swap-test > swap-host.log 2>&1 &
            HOST_PID=$!
            for i in $(seq 1 60); do grep -q "Hôte en écoute" swap-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
            "$GODOT" --headless --path . --max-fps 60 --quit-after 2400 -- --join=127.0.0.1 --port=7360 --zone=1 --net-lag=30 --map=croix_neon --pc-autoplay > swap-client.log 2>&1 || true
            wait $HOST_PID || true
            if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" swap-host.log swap-client.log; then echo "Erreur à l'exécution (échanges de plaques)"; exit 1; fi
            SWAPS=$(grep -c "Échange de plaques : joueur 0 <-> joueur 1" swap-host.log || true)
            MOVED=$(cat swap-host.log swap-client.log | grep -c "\[PC\] Échange de plaques" || true)
            CLOSE=$(grep -c "Échange confirmé : la zone 1 " swap-host.log || true)
            echo "Essai $ATTEMPT : échanges $SWAPS, joueurs déplacés $MOVED, client confirmé par l'hôte $CLOSE"
            if [ "$SWAPS" -ge 1 ] && [ "$MOVED" -ge 2 ] && [ "$CLOSE" -ge 1 ]; then exit 0; fi
          done
          echo "Échange de plaques non reconnu"; exit 1

      - name: Test Fosse croisée (tremplin, terrasse, tacle, ring-out, dash qui s'arrête avant le vide)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          for ATTEMPT in 1 2 3 4; do
            "$GODOT" --headless --path . --max-fps 60 --quit-after 4800 -- --host --map=fosse_croisee --pc-autoplay > fc-host.log 2>&1 &
            HOST_PID=$!
            for i in $(seq 1 60); do grep -q "Hôte en écoute" fc-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
            "$GODOT" --headless --path . --max-fps 60 --quit-after 4000 -- --join=127.0.0.1 --zone=1 --net-lag=30 --map=fosse_croisee --pc-autoplay > fc-client.log 2>&1
            wait $HOST_PID || true
            if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" fc-host.log fc-client.log; then
              echo "Erreur à l'exécution (Fosse croisée, réseau)"; exit 1
            fi
            PADS=$(cat fc-host.log fc-client.log | grep -c "\[PC\] Tremplin" || true)
            TERRACES=$(grep -c "\[Net\] Terrasse .* atteinte" fc-host.log || true)
            STOPS=$(cat fc-host.log fc-client.log | grep -c "Dash arrêté avant le vide" || true)
            FALLS=$(grep -c "Chute dans la fosse" fc-host.log || true)
            TACKLES=$(grep -c "\[Match\] Tacle du joueur 1 sur le joueur 0" fc-host.log || true)
            RINGOUTS=$(grep -c "Ring-out : le joueur 0 est poussé dans la fosse par le joueur 1" fc-host.log || true)
            SPECIALS=$(grep -c "\[Client\] Balle spéciale reçue" fc-client.log || true)
            echo "Fosse croisée : tremplins $PADS, terrasses validées $TERRACES, dashs arrêtés $STOPS, chutes $FALLS, tacles $TACKLES, ring-outs $RINGOUTS, balles spéciales reçues par le client $SPECIALS"
            if [ "$SPECIALS" -lt 1 ] || [ "$PADS" -lt 2 ] || [ "$TERRACES" -lt 1 ] || [ "$STOPS" -lt 1 ] || [ "$FALLS" -lt 1 ] || [ "$TACKLES" -lt 1 ] || [ "$RINGOUTS" -lt 1 ]; then
              echo "Tentative $ATTEMPT : tremplin, terrasse, arrêt du dash, chute, tacle du client ou ring-out non reconnus"
              [ "$ATTEMPT" = 4 ] && exit 1
            else
              break
            fi
          done

      - name: Test Tour 4v4 (huit plaques, fosse 16×10, tremplin, terrasse, tacle, ring-out)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          for ATTEMPT in 1 2 3 4; do
            "$GODOT" --headless --path . --max-fps 60 --quit-after 4800 -- --host --map=tour_4v4 --pc-autoplay > tr-host.log 2>&1 &
            HOST_PID=$!
            for i in $(seq 1 60); do grep -q "Hôte en écoute" tr-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
            "$GODOT" --headless --path . --max-fps 60 --quit-after 4000 -- --join=127.0.0.1 --zone=1 --net-lag=30 --map=tour_4v4 --pc-autoplay > tr-client.log 2>&1
            wait $HOST_PID || true
            if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" tr-host.log tr-client.log; then
              echo "Erreur à l'exécution (Tour 4v4, réseau)"; exit 1
            fi
            PADS=$(cat tr-host.log tr-client.log | grep -c "\[PC\] Tremplin" || true)
            TERRACES=$(grep -c "\[Net\] Terrasse .* atteinte" tr-host.log || true)
            STOPS=$(cat tr-host.log tr-client.log | grep -c "Dash arrêté avant le vide" || true)
            FALLS=$(grep -c "Chute dans la fosse" tr-host.log || true)
            TACKLES=$(grep -c "\[Match\] Tacle du joueur 1 sur le joueur 0" tr-host.log || true)
            RINGOUTS=$(grep -c "Ring-out : le joueur 0 est poussé dans la fosse par le joueur 1" tr-host.log || true)
            echo "Tour 4v4 : tremplins $PADS, terrasses validées $TERRACES, dashs arrêtés $STOPS, chutes $FALLS, tacles $TACKLES, ring-outs $RINGOUTS"
            if [ "$PADS" -lt 2 ] || [ "$TERRACES" -lt 1 ] || [ "$STOPS" -lt 1 ] || [ "$FALLS" -lt 1 ] || [ "$TACKLES" -lt 1 ] || [ "$RINGOUTS" -lt 1 ]; then
              echo "Tentative $ATTEMPT : tremplin, terrasse, arrêt du dash, chute, tacle du client ou ring-out non reconnus"
              [ "$ATTEMPT" = 4 ] && exit 1
            else
              break
            fi
          done


      - name: Test lobby en ligne (partie rapide LAN, lancement, reconnexion après coupure, retour après crash)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --max-fps 60 --quit-after 15000 -- --lobby-host --autostart=1 --map=croix_neon --pc-autoplay --name=Hote --quit-file=lobby-done > lobby-host.log 2>&1 &
          HOST_PID=$!
          # On attend que la salle soit ouverte (démarrage de Godot .NET plus ou moins lent selon le runner).
          for i in $(seq 1 60); do grep -q "\[Lobby\] Salle ouverte" lobby-host.log && break; sleep 0.5; done
          # 0) Version différente : le client est refusé à la poignée de main, avant tout RPC, avec un message clair.
          "$GODOT" --headless --path . --max-fps 60 --quit-after 400 -- --lobby-join=127.0.0.1 --fake-version --name=Vieux > lobby-c0.log 2>&1
          # 1) Partie rapide : le client trouve la salle sur le réseau local, se déclare prêt, l'hôte lance ; coupure réseau à 20 s puis reconnexion.
          "$GODOT" --headless --path . --max-fps 60 --quit-after 3000 -- --lobby-quick --auto-ready --pc-autoplay --token=ci-reco --name=Reco --net-cut=20 > lobby-c1.log 2>&1
          # 2) Entrée en cours de partie, crash brutal (SIGKILL) 3 s après l'entrée en jeu, retour avec le même jeton : même zone.
          "$GODOT" --headless --path . --max-fps 60 --quit-after 3000 -- --lobby-join=127.0.0.1 --auto-ready --pc-autoplay --token=ci-crash --name=Crash > lobby-c2.log 2>&1 &
          C2_PID=$!
          for i in $(seq 1 60); do grep -q "Entrée acceptée par l'hôte" lobby-c2.log && break; sleep 0.5; done
          sleep 3
          kill -KILL $C2_PID 2>/dev/null || true
          wait $C2_PID 2>/dev/null || true
          # Relance aussitôt : selon que l'hôte a déjà vu la coupure ou non, la zone revient par la réservation ou par l'éviction de la connexion muette.
          sleep 1
          "$GODOT" --headless --path . --max-fps 60 --quit-after 900 -- --lobby-join=127.0.0.1 --auto-ready --pc-autoplay --token=ci-crash --name=Crash > lobby-c3.log 2>&1
          # L'hôte a de la marge (250 s) : on le ferme proprement dès que les clients ont fini, quelle que soit la vitesse du runner.
          touch lobby-done
          wait $HOST_PID || true
          rm -f lobby-done
          grep -E "\[Lobby\]|\[Net\] (Pair|Joueur|Reconnexion|Secret|Entrée|Test|Version)" lobby-host.log lobby-c0.log lobby-c1.log lobby-c2.log lobby-c3.log | head -70
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" lobby-host.log lobby-c0.log lobby-c1.log lobby-c2.log lobby-c3.log; then echo "Erreur à l'exécution (lobby)"; exit 1; fi
          # RPC vers un nœud absent (course entre rechargement de scène et réseau) : Godot l'écrit en ERROR, pas en exception.
          if grep -iE "ERROR:.*(node not found|invalid packet|rpc|cached)" lobby-host.log lobby-c0.log lobby-c1.log lobby-c2.log lobby-c3.log; then echo "RPC perdu ou mal routé (lobby)"; exit 1; fi
          FAIL=0
          grep -q "\[Lobby\] Échec : Version différente" lobby-c0.log || { echo "Version différente non détectée à la poignée de main"; FAIL=1; }
          grep -q "\[Lobby\] Partie trouvée" lobby-c1.log || { echo "Partie rapide : salle LAN non trouvée"; FAIL=1; }
          grep -q "\[Lobby\] Lancement : croix_neon, 2 joueur(s)" lobby-host.log || { echo "L'hôte n'a pas lancé la partie depuis la salle"; FAIL=1; }
          grep -q "\[Lobby\] État : InMatch -> Reconnecting" lobby-c1.log || { echo "Le client n'a pas tenté de se reconnecter"; FAIL=1; }
          Z1=$(grep -o "Entrée acceptée par l'hôte, zone [0-9]*" lobby-c1.log | head -1 | grep -o "[0-9]*$")
          [ -n "$Z1" ] && [ "$(grep -c "Entrée acceptée par l'hôte, zone $Z1\$" lobby-c1.log)" -ge 2 ] || { echo "Le client reconnecté n'a pas retrouvé sa zone"; FAIL=1; }
          [ "$(grep -c "Reconnexion : le secret [0-9a-f]* retrouve la zone" lobby-host.log)" -ge 2 ] || { echo "L'hôte n'a pas rendu leur zone aux joueurs revenus (coupure puis crash)"; FAIL=1; }
          if grep -q "Secret déjà en jeu (pair [0-9]*, muet) : ancienne connexion remplacée" lobby-host.log; then echo "Crash : connexion muette remplacée"; else echo "Crash : coupure vue avant le retour, zone rendue par la réservation"; fi
          Z2=$(grep -o "Entrée acceptée par l'hôte, zone [0-9]*" lobby-c2.log | tail -1 | grep -o "[0-9]*$")
          Z3=$(grep -o "Entrée acceptée par l'hôte, zone [0-9]*" lobby-c3.log | tail -1 | grep -o "[0-9]*$")
          [ -n "$Z2" ] && [ "$Z2" = "$Z3" ] || { echo "Après le crash, le joueur n'a pas retrouvé sa zone ($Z2 puis $Z3)"; FAIL=1; }
          CATCHES=$(grep -c "attrapée par la zone ${Z1:-1}\$" lobby-host.log || true)
          echo "Prises du client du lobby validées par l'hôte : $CATCHES"
          [ "$CATCHES" -ge 3 ] || { echo "Le client entré par le lobby ne joue pas"; FAIL=1; }
          exit $FAIL

      - name: Test de bout en bout (salle à 4, hôte + 3 clients + 4 bots, fin de partie, retour à la salle, revanche)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          rm -f e2e-done e2e-*.log e2e-*.log.run
          "$GODOT" --headless --path . --max-fps 60 --quit-after 20000 -- --lobby-host --autostart=3 --map=tour_4v4 --pc-autoplay --name=Hote --end-screen-test --quit-file=e2e-done > e2e-host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 60); do grep -q "\[Lobby\] Salle ouverte" e2e-host.log && break; sleep 0.5; done
          PIDS=""
          for n in 1 2 3; do
            "$GODOT" --headless --path . --max-fps 60 --quit-after 20000 -- --lobby-join=127.0.0.1 --auto-ready --pc-autoplay --name=Joueur$n --token=ci-e2e-$n --quit-file=e2e-done > e2e-c$n.log 2>&1 &
            PIDS="$PIDS $!"
          done
          # Partie 1 (finie d'office à 14 s par --end-screen-test), retour à la salle, revanche, partie 2 : on attend le second retour.
          for i in $(seq 1 300); do [ "$(grep -c "\[Lobby\] Revanche\$" e2e-host.log)" -ge 2 ] && break; sleep 0.5; done
          sleep 4
          touch e2e-done
          wait $HOST_PID $PIDS || true
          rm -f e2e-done
          grep -E "\[Lobby\]" e2e-host.log | head -40
          FAIL=0
          # On juge le jeu, pas l'arrêt du moteur : seules les lignes d'avant « Fin du test » comptent (fuites de ressources à la fermeture signalées à part).
          for f in e2e-*.log; do sed '/\[Lobby\] Fin du test : fermeture/q' "$f" > "$f.run"; done
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" e2e-*.log.run; then echo "Erreur à l'exécution (bout en bout)"; FAIL=1; fi
          if grep -iE "ERROR:.*(node not found|invalid packet|rpc|cached)" e2e-*.log.run; then echo "RPC perdu ou mal routé (bout en bout)"; FAIL=1; fi
          grep -l "Fatal error\|Leaked unsafe reference" e2e-*.log | sed 's/^/Fermeture du moteur bruyante (hors test) : /' || true
          [ "$(grep -c "\[Lobby\] Lancement : tour_4v4, 4 joueur(s)" e2e-host.log)" -ge 2 ] || { echo "Pas de revanche à 4 joueurs après le retour à la salle"; FAIL=1; }
          grep -q "\[Lobby\] Lancement : tour_4v4, 4 joueur(s), format en ligne" e2e-host.log || { echo "Salle sans casque : le format en ligne n'a pas été choisi"; FAIL=1; }
          grep -q "\[HUD\] Countdown : manche 1/3" e2e-c1.log || { echo "Client : format en ligne (3 manches au plus) non appliqué"; FAIL=1; }
          ZONES=""
          for n in 1 2 3; do
            Z=$(grep -o "Entrée acceptée par l'hôte, zone [0-9]*" e2e-c$n.log | head -1 | grep -o "[0-9]*$")
            [ -n "$Z" ] || { echo "Joueur$n n'est jamais entré en partie"; FAIL=1; continue; }
            grep -q "\[Lobby\] État : InMatch -> InRoom" e2e-c$n.log || { echo "Joueur$n n'est pas revenu dans la salle"; FAIL=1; }
            C=$(grep -c "attrapée par la zone $Z\$" e2e-host.log || true)
            echo "Joueur$n : zone $Z, prises validées par l'hôte : $C"
            [ "$C" -ge 1 ] || { echo "Joueur$n ne joue pas"; FAIL=1; }
            ZONES="$ZONES $Z"
          done
          [ "$(echo $ZONES | tr ' ' '\n' | sort -u | wc -l)" -eq 3 ] || { echo "Zones en double :$ZONES"; FAIL=1; }
          exit $FAIL
      - name: Test réseau dégradé (80 ms de latence par sens, 5 % de perte)
        run: |
          GODOT_VERSION=4.3-stable
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT" --headless --path . --max-fps 60 --quit-after 6300 -- --host --port=7390 > bad-host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 60); do grep -q "Hôte en écoute" bad-host.log && break; sleep 0.5; done   # hôte prêt (démarrage plus ou moins lent selon le runner)
          "$GODOT" --headless --path . --max-fps 60 --quit-after 5400 -- --join=127.0.0.1 --port=7390 --net-selftest --net-lag=80 --net-loss=0.05 > bad-client.log 2>&1
          wait $HOST_PID || true
          if grep -E "SCRIPT ERROR|Unhandled|System\.[A-Za-z]+Exception" bad-host.log bad-client.log; then echo "Erreur à l'exécution (réseau dégradé)"; exit 1; fi
          CATCHES=$(grep -c "attrapée par la zone 2" bad-host.log || true)
          THROWS=$(grep -c "lancée par la zone 2" bad-host.log || true)
          echo "Réseau dégradé : prises $CATCHES, lancers $THROWS"
          if [ "$CATCHES" -lt 5 ] || [ "$THROWS" -lt 5 ]; then echo "Le jeu ne tient pas 80 ms et 5 % de perte"; exit 1; fi
          grep -E "balles=[1-9]" bad-client.log > /dev/null || { echo "Le client ne voit pas les balles"; exit 1; }

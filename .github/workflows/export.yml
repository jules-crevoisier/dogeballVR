name: Export test PC

# Produit un build Windows jouable au clavier-souris à chaque merge sur main.
# Téléchargement : onglet Releases du dépôt, version « build-latest ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
      # Bibliothèques natives Steamworks (même source que steam-upload.yml).
      STEAMWORKS_NET_URL: https://github.com/rlabrecque/Steamworks.NET/releases/download/2024.8.0/Steamworks.NET-Standalone_2024.8.0.zip
      STEAMWORKS_NET_SHA256: 08094d1372c6d793d6b5b87c59f1362a10fe8580acb1db6bfaf081a511f6758c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Installer Godot et ses modèles d'export
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
          unzip -q godot.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable.mono"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable.mono/"

      - name: Exporter pour Windows
        run: |
          GODOT="$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          mkdir -p build/windows
          # L'export compile lui-même le C# (--build-solutions plante sur le runner, inutile ici).
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/DogeballVR.exe
          test -f build/windows/DogeballVR.exe

      - name: Ajouter la bibliothèque Steamworks
        run: |
          mkdir -p steamworks-net
          curl -sSL -o steamworks-net/sw.zip "$STEAMWORKS_NET_URL"
          echo "$STEAMWORKS_NET_SHA256  steamworks-net/sw.zip" | sha256sum -c -
          unzip -q steamworks-net/sw.zip -d steamworks-net/x
          # À côté de l'exe (chargement natif par Windows) et dans le dossier data (chargement par l'assembly C#).
          cp steamworks-net/x/Windows-x64/steam_api64.dll build/windows/
          cp steamworks-net/x/Windows-x64/steam_api64.dll build/windows/data_DogeballVR_windows_x86_64/

      - name: Empaqueter
        run: |
          mkdir -p dist/DogeballVR-test-windows
          cp -r build/windows/DogeballVR.exe build/windows/steam_api64.dll build/windows/data_DogeballVR_windows_x86_64 dist/DogeballVR-test-windows/
          cp docs/LISEZ-MOI-test.txt dist/DogeballVR-test-windows/
          # 480 = Spacewar, l'AppID de test public de Valve : lobbies et P2P Steam sans compte Steamworks.
          # Zip de test seulement : ce fichier ne part jamais sur Steam (exclu par tools/steam/depot_build_*.vdf.template).
          printf '480' > dist/DogeballVR-test-windows/steam_appid.txt
          (cd dist && zip -qr ../DogeballVR-test-windows.zip DogeballVR-test-windows)

      - uses: actions/upload-artifact@v4
        with:
          name: DogeballVR-test-windows
          path: DogeballVR-test-windows.zip

      - name: Publier la release build-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --yes --cleanup-tag || true
          gh release create build-latest DogeballVR-test-windows.zip \
            --title "Build de test (PC)" \
            --notes "Build Windows jouable au clavier-souris, généré automatiquement depuis main. Voir LISEZ-MOI-test.txt dans le zip (Steam lancé : test des fonctions Steam avec l'AppID 480 Spacewar ; sans Steam : LAN/IP)." \
            --target "${{ github.sha }}"
